<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Sentence Forge — DOM check</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <!-- Deterministic layout measurement: collapse entry animations to 0s so the
       presentation checks (9–10) measure settled bounds, not a mid-animation
       transform (e.g. view-in's translateY). Test-only; not part of the app. -->
  <style>*, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition-duration: 0s !important; }</style>
</head>
<!--
  Headless render + runtime check. Not part of the app. It has two parts:

    - Parse-time checks (1–5): every label in the taxonomy renders its mark, each
      sample renders all its annotations, the palette builds, notes and the Key
      legend render. These use render/editor/store only.
    - Runtime checks (6–8): load the FULL app (app.js/display.js/quiz.js) against
      the real page chrome and verify boot, storage guards, the keyboard token
      selection path, and the confirmation dialog's a11y (audit P0-2/P0-3).
    - Presentation checks (9–10): drive the real Present and Quiz views and assert
      the slide-shell contract (UI audit 0.1.0) — no document overflow, stage/nav/
      controls/panel within the viewport, clean state reserves no hidden lanes,
      the detail panel's resting state for the breakpoint, Key panel focus +
      Escape restore, dot labels, and Practice question focus.
      These need a sized window; pass --window-size=1280,720 (the 720p gate).
      They run as a chain of one-task-apart steps (runSettled) because the
      renderer wraps sentences in a task LATER than the one that renders them —
      measuring geometry in the render's own task reads a deliberate single-line
      layout and answers the wrong question. See plans/014.
    - Assignment checks (11): drive the real builder view — the route opens the
      right lesson, unavailable skills are disabled with the model's own reason,
      the pool readout matches wjt.assignment.poolSize, Regenerate redraws, and
      the student preview carries no answer-key material.
    - Print checks (12): click the real Print buttons with window.print() stubbed
      — the worksheet mounts a purpose-built document with no app chrome, no
      answer-key material and no lesson id, the answer key is marked and fully
      answered, all three renderings agree on numbering, and `afterprint` puts
      the builder back untouched.
    - Delivery-channel checks (13): seam S5 in the real builder. This page IS a
      file:// origin, which is the degraded mode P3 describes — so "print and
      file stay on, the link is off and says why in teacher language" is
      *measured* here rather than reasoned about, and the File button's download
      is intercepted to prove it carries the student half only.

  Run it (the Git-Bash `>` redirect returns an EMPTY dump for this GUI process —
  use PowerShell Start-Process, which waits for the child and captures stdout):

    $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
    $udd  = Join-Path $env:TEMP ("edge-udd-" + [guid]::NewGuid())
    $dump = Join-Path $env:TEMP ("dom-" + [guid]::NewGuid() + ".html")
    Start-Process -FilePath $edge -Wait -NoNewWindow -RedirectStandardOutput $dump `
      -ArgumentList "--headless=new","--disable-gpu","--no-sandbox",`
      "--virtual-time-budget=8000","--window-size=1280,720","--dump-dom","--user-data-dir=$udd",`
      "file:///C:/dev/sentences/tools/dom-check.html"
    node tools/dom-check-report.js $dump

  Spot-check the other matrix sizes by re-running with --window-size=1366,768 /
  1920,1080 / 1024,768; the required contract is 0 failed at each.

  The temp user-data-dir and a Windows-style drive (file:///C:/…) are both
  required. Results are summarized in #result as PASS/FAIL lines. Read them with
  dom-check-report.js, NOT by grepping the dump — the dump includes this file's
  own script, and the strings "PASS" and "FAIL" appear in it as source text.
-->
<body>
  <!-- Real page chrome so app.js boots exactly as it does in index.html. -->
  <nav class="topbar">
    <a class="brand" href="#/">Sentence Forge</a>
    <button id="palette-toggle" aria-pressed="false">🎨</button>
    <button id="theme-toggle">☀️</button>
  </nav>
  <main id="app"></main>
  <div id="toasts" aria-live="polite"></div>
  <footer class="appfoot"><span data-role="version"></span></footer>
  <pre id="result"></pre>

  <script src="../js/labels.js"></script>
  <script src="../js/tokenize.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/examples.js"></script>
  <script src="../js/assignment-model.js"></script>
  <script src="../js/assignment-codec.js"></script>
  <script src="../js/assignment-channels.js"></script>
  <script src="../js/assignment.js"></script>
  <script src="../js/render.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/display.js"></script>
  <script src="../js/quiz.js"></script>
  <script src="../js/app.js"></script>

  <script>
  (function () {
    var out = [];
    var fails = 0;
    function check(name, cond) {
      out.push((cond ? "PASS  " : "FAIL  ") + name);
      if (!cond) fails++;
    }
    function finish() {
      out.push(fails ? fails + " FAILURE(S)" : "ALL DOM CHECKS PASSED");
      document.getElementById("result").textContent = out.join("\n");
    }

    window.onerror = function (msg, src, line) {
      out.push("FAIL  uncaught error: " + msg + " @" + src + ":" + line);
      fails++;
      document.getElementById("result").textContent = out.join("\n");
    };

    var app = document.getElementById("app");

    // 1. Every label renders its mark over a real sentence: POS labels become
    //    chips above the word, the other three layers become span bars.
    //    One annotation per sentence keeps the lane packing trivial.
    Object.keys(wjt.LABELS).forEach(function (id) {
      var label = wjt.LABELS[id];
      var sentence = {
        id: wjt.uid(), text: "The curious fox darted across the frozen river.",
        annotations: [{ id: wjt.uid(), start: 4, end: 15, label: id, note: "" }],
      };
      var r = wjt.renderSentence(sentence, { layers: [label.layer] });
      app.appendChild(r.root);
      var isPos = label.layer === "pos";
      var mark = r.root.querySelector(isPos ? ".gl-chip" : ".gl-bar");
      check("label " + id + " renders a " + (isPos ? "chip" : "bar"), !!mark);
      if (mark) {
        check("label " + id + " mark carries its color",
          (mark.getAttribute("style") || "").indexOf(label.color) !== -1);
      }
      // A subtype must also render its parent's broad-class chip above it.
      if (isPos && label.parent) {
        check("subtype " + id + " renders a parent chip",
          !!r.root.querySelector(".gl-chip-parent"));
      }
    });

    // 2. Each sample lesson renders every one of its annotations.
    wjt.EXAMPLES.forEach(function (ex) {
      var lesson = ex.build();
      var marks = 0, expected = 0;
      lesson.sentences.forEach(function (s) {
        expected += s.annotations.length;
        var r = wjt.renderSentence(s, { layers: lesson.layers });
        app.appendChild(r.root);
        // Count one mark per annotation: bars, plus the *specific* chips only
        // (a POS subtype adds a second, parent chip that isn't its own mark).
        // Count distinct data-ann so a span wrapped across lines — which renders
        // one squared segment per line — still counts as a single mark.
        var ids = {};
        Array.prototype.forEach.call(
          r.root.querySelectorAll(".gl-bar, .gl-chip:not(.gl-chip-parent)"),
          function (el) { ids[el.dataset.ann] = 1; });
        marks += Object.keys(ids).length;
      });
      check("example " + ex.id + ": rendered " + marks + "/" + expected + " annotation marks",
        marks === expected && expected > 0);
    });

    // 3. The editor palette builds for all four layers, in both tier modes.
    [false, true].forEach(function (essentialOnly) {
      wjt.LAYER_ORDER.forEach(function (layerId) {
        var groups = 0, buttons = 0;
        if (wjt.layerHasSubtypes(layerId)) {
          wjt.baseLabelsForLayer(layerId).forEach(function (baseId) {
            var children = wjt.filterTier(wjt.childrenOf(baseId), essentialOnly);
            if (essentialOnly && !wjt.isEssential(baseId) && !children.length) return;
            groups++;
            buttons += 1 + children.length;
          });
        } else {
          buttons = groups = wjt.filterTier(wjt.labelsForLayer(layerId), essentialOnly).length;
        }
        check("palette layer " + layerId + " (essentialOnly=" + essentialOnly + "): " +
          groups + " groups / " + buttons + " buttons", groups > 0 && buttons > 0);
      });
    });

    // 4. Sentence-level note renders only when present, and is escaped.
    check("sentence note: null when absent",
      wjt.renderSentenceNote({ text: "No note." }) === null);
    check("sentence note: null when empty string",
      wjt.renderSentenceNote({ text: "x", notes: "" }) === null);
    var noteEl = wjt.renderSentenceNote({ text: "x", notes: "A <cleft> & such." });
    check("sentence note: renders a .sentence-note element",
      !!noteEl && noteEl.classList.contains("sentence-note"));
    check("sentence note: text is HTML-escaped",
      !!noteEl && noteEl.innerHTML.indexOf("&lt;cleft&gt;") !== -1 &&
      noteEl.innerHTML.indexOf("<cleft>") === -1);

    // 5. Present-mode Key legend: shows only shown layers annotated in the
    //    sentence, one item per distinct label (de-duped), swatch · abbr · name.
    var legSentence = {
      text: "x",
      annotations: [
        { label: "noun" }, { label: "noun" }, { label: "verb" },  // pos (noun repeats)
        { label: "subject" },                                      // part
      ],
    };
    check("legend: null when no layers shown",
      wjt.renderLegend(legSentence, []) === null);
    check("legend: null when shown layer has no annotations here",
      wjt.renderLegend({ text: "x", annotations: [{ label: "noun" }] }, ["clause"]) === null);
    var legEl = wjt.renderLegend(legSentence, ["pos"]);
    check("legend: renders a group for the shown layer",
      !!legEl && legEl.querySelectorAll(".legend-group").length === 1);
    check("legend: layer heading names the layer",
      !!legEl && legEl.querySelector(".legend-layer").textContent === wjt.LAYERS.pos.name);
    check("legend: one item per distinct label (noun de-duped)",
      !!legEl && legEl.querySelectorAll(".legend-item").length === 2);
    check("legend: item carries swatch, abbr, and name",
      !!legEl && (function () {
        var it = legEl.querySelector(".legend-item");
        return (it.querySelector(".swatch").getAttribute("style") || "").indexOf(wjt.LABELS.noun.color) !== -1 &&
          it.querySelector("b").textContent === wjt.LABELS.noun.abbr &&
          it.textContent.indexOf(wjt.LABELS.noun.name) !== -1;
      })());
    var legTwo = wjt.renderLegend(legSentence, ["pos", "part"]);
    check("legend: one group per shown layer with annotations",
      !!legTwo && legTwo.querySelectorAll(".legend-group").length === 2);

    /* -------------------------------------------------------------------- *
     * Runtime checks (6–8) — run AFTER app.js has booted the real app, so
     * these cover the P4 runtime paths the old harness never loaded. app.js
     * registered its DOMContentLoaded boot before this script, so its handler
     * fires first (clearing #app and routing to Home) and ours runs after.
     * -------------------------------------------------------------------- */
    /* Wrap stress fixture. A span bar carries its label's full NAME, which can be
     * far wider than the tokens it covers ("Prepositional Phrase" over "up"), and
     * the grid's max-content columns grow to fit it. Wrapping used to be decided
     * from token widths alone, so a line that "fit" rendered past the container
     * and scrolled sideways in silence (.gl-grid hides its scrollbar). Render one
     * of those into a deliberately narrow host here, before the settle timer, and
     * assert after it that it wrapped instead of running off. */
    var stressHost = null;
    function buildWrapStress() {
      var text = "up in the old house on the hill by the sea at dawn in the cold";
      var anns = [];
      // A prepositional phrase over each 2-word pair: every bar's name is much
      // wider than the two short tokens it spans.
      for (var at = 0; at + 6 <= text.length; at += 7) {
        anns.push({ id: wjt.uid(), start: at, end: Math.min(at + 6, text.length), label: "prepositional-phrase", note: "" });
      }
      stressHost = document.createElement("div");
      stressHost.style.cssText = "width:640px;position:absolute;left:-9999px;top:0;";
      document.body.appendChild(stressHost);
      var r = wjt.renderSentence({ id: wjt.uid(), text: text, annotations: anns },
        { layers: ["phrase"], size: "lg" });
      stressHost.appendChild(r.root);
    }
    function checkWrapStress() {
      if (!stressHost) return;
      var grids = stressHost.querySelectorAll(".gl-grid");
      var worst = 0, runOff = 0;
      Array.prototype.forEach.call(grids, function (g) {
        var over = g.scrollWidth - g.clientWidth;
        if (over > worst) worst = over;
        if (over > 1 && g.querySelectorAll(".gl-token").length > 1) runOff++;
      });
      check("wrap stress: a wide span label wraps the line instead of running off " +
        "(" + grids.length + " lines, worst overflow " + worst + "px)",
        grids.length > 1 && runOff === 0);
      stressHost.parentNode.removeChild(stressHost);
    }

    /* Never measure layout in the same task as the render that produced it.
     * wjt.renderSentence() lays every sentence out as ONE line on purpose — the
     * state it can measure from — and re-wraps in a post-render microtask, or
     * failing that in the ResizeObserver's first callback (js/render.js). Both
     * are later tasks, so a geometry assertion in the rendering task reads the
     * deliberate pre-wrap single-line layout. That is what made UI-4 report a
     * 5714px overflow against a renderer that wraps correctly — and, before the
     * Declaration examples made the densest lesson's longest sentence 406
     * characters instead of 53, what let the same wrong measurement *pass* for
     * months (plans/014). A geometry check here is only as good as the moment it
     * measures.
     *
     * So the view-driving blocks are a chain of steps, each in its own task: a
     * step asserts against the layout the PREVIOUS step left behind, then makes
     * its own change at the end. A plain timer is the right yield — rAF is not
     * reliably serviced under headless virtual time, and a timer is
     * fast-forwarded inside --virtual-time-budget: the ~900ms of settles below
     * costs no real time, and the whole run completes inside 1500ms of virtual
     * time against CI's 5000ms budget. Starving the budget can't pass quietly
     * either — finish() writes the result block in one go, so a run cut short
     * leaves it empty and dom-check-report.js exits 1 on that.
     * finish() runs exactly once, after the last step. */
    var SETTLE_MS = 100;
    function runSettled(steps, done) {
      var i = 0;
      function tick() {
        if (i >= steps.length) { done(); return; }
        var step = steps[i++];
        try { step.fn(); }
        catch (e) { check(step.name + " threw: " + e.message, false); }
        setTimeout(tick, SETTLE_MS);   // settle before the next step measures
      }
      setTimeout(tick, SETTLE_MS);     // ...and before the first one, too
    }

    document.addEventListener("DOMContentLoaded", function () {
      try { runtimeChecks(); }
      catch (e) { check("runtime checks threw: " + e.message, false); }
      try { buildWrapStress(); }
      catch (e) { check("wrap stress fixture threw: " + e.message, false); }
      runSettled([
        { name: "wrap stress check", fn: checkWrapStress },
        { name: "present render", fn: presentRender },
        { name: "present clean checks", fn: presentClean },
        { name: "present breakdown checks", fn: presentBreakdown },
        { name: "present panel resting checks", fn: presentPanelRest },
        { name: "present panel open checks", fn: presentPanelOpen },
        { name: "present teardown checks", fn: presentLeave },
        { name: "practice checks", fn: practiceChecks },
        { name: "assignment checks", fn: assignmentChecks },
      ], finish);
    });

    function key(el, opts) {
      opts = opts || {};
      opts.bubbles = true; opts.cancelable = true;
      el.dispatchEvent(new KeyboardEvent("keydown", opts));
    }

    function runtimeChecks() {
      // 6. Boot renders content and the app didn't throw (audit P0-2). The Home
      //    view replaced #app wholesale; if boot had thrown, #app stays empty.
      check("P0-2: app booted and rendered a view into #app", app.children.length > 0);
      check("P0-2: footer version reflects wjt.VERSION",
        (document.querySelector('[data-role="version"]').textContent || "")
          .indexOf(wjt.VERSION) !== -1);

      // 6b. safeStorage swallows a store that throws on access, instead of
      //     letting it escape and blank the app (the P0-2 boot hazard).
      check("P0-2: wjt.safeStorage exposes get/set",
        !!wjt.safeStorage && typeof wjt.safeStorage.get === "function" &&
        typeof wjt.safeStorage.set === "function");
      var proto = Object.getPrototypeOf(localStorage);
      var origGet = proto.getItem, origSet = proto.setItem, savedOK = wjt.storageOK;
      try {
        proto.getItem = function () { throw new Error("storage disabled"); };
        proto.setItem = function () { throw new Error("storage disabled"); };
        wjt.storageOK = true;
        var got = wjt.safeStorage.get("anything");
        var setOK = wjt.safeStorage.set("anything", "x");
        check("P0-2: safeStorage.get returns null on a throwing store", got === null);
        check("P0-2: safeStorage.set returns false on a throwing store", setOK === false);
        check("P0-2: a throwing store flips wjt.storageOK false", wjt.storageOK === false);
      } finally {
        proto.getItem = origGet; proto.setItem = origSet; wjt.storageOK = savedOK;
      }

      // 7. Keyboard token selection (audit P0-3): interactive tokens are
      //    focusable buttons, and the keyboard gesture drives the SAME onSelect
      //    as a pointer drag — so a keyboard user can create a label.
      var picked = null;
      var r = wjt.renderSentence(
        { text: "The quick brown fox jumped.", annotations: [] },
        { layers: ["pos"], interactive: true, onSelect: function (range) { picked = range; } });
      app.appendChild(r.root);
      var toks = r.root.querySelectorAll(".gl-token");
      check("P0-3: interactive tokens are focusable buttons",
        toks.length > 0 && toks[0].getAttribute("role") === "button" &&
        toks[0].getAttribute("tabindex") !== null);
      check("P0-3: exactly one token starts in the Tab order (roving tabindex)",
        r.root.querySelectorAll('.gl-token[tabindex="0"]').length === 1);

      picked = null;
      key(toks[1], { key: "Enter" });
      check("P0-3: Enter on a token commits that single word",
        !!picked && picked.first === 1 && picked.last === 1);

      picked = null;
      key(toks[1], { key: "ArrowRight", shiftKey: true });  // extend head 1 -> 2
      var focused = r.root.querySelector('.gl-token[tabindex="0"]');
      check("P0-3: Shift+Arrow moves the roving focus to the extended word",
        focused === toks[2]);
      key(focused, { key: "Enter" });
      check("P0-3: Shift+Arrow then Enter commits a multi-word span",
        !!picked && picked.first === 1 && picked.last === 2);

      // 8. Confirmation dialog a11y (audit P0-3): named + Tab focus trap.
      var confirmed = false;
      wjt.confirmDialog({ message: "Delete this thing?", confirmText: "Delete",
        onConfirm: function () { confirmed = true; } });
      var modal = document.querySelector(".modal");
      check("P0-3: confirm dialog is a modal dialog",
        !!modal && modal.getAttribute("role") === "dialog" &&
        modal.getAttribute("aria-modal") === "true");
      var lb = modal && modal.getAttribute("aria-labelledby");
      var named = lb && document.getElementById(lb) &&
        document.getElementById(lb).textContent.indexOf("Delete this thing?") !== -1;
      check("P0-3: confirm dialog has an accessible name", !!named);

      var cancel = modal.querySelector(".btn:not(.btn-primary)");
      var ok = modal.querySelector(".btn-primary");
      // Focus-trap: assert only if headless focus tracking works (it does in
      // Chromium --headless=new); otherwise report that it was not exercised.
      ok.focus();
      if (document.activeElement === ok) {
        key(ok, { key: "Tab" });
        check("P0-3: Tab from the last button wraps to the first (focus trap)",
          document.activeElement === cancel);
        cancel.focus();
        key(cancel, { key: "Tab", shiftKey: true });
        check("P0-3: Shift+Tab from the first button wraps to the last",
          document.activeElement === ok);
      } else {
        check("P0-3: focus trap NOT EXERCISED (headless focus unavailable)", true);
      }
      // Close via Escape and confirm the callback never fired on a cancel path.
      key(document, { key: "Escape" });
      check("P0-3: Escape closes the dialog without confirming",
        !document.querySelector(".modal") && confirmed === false);
    }

    // A rect is "in viewport" when it sits inside the window with a 1px rounding
    // tolerance — the bounds contract for the slide shell and its panel.
    function inViewport(el, tol) {
      tol = tol || 1;
      var r = el.getBoundingClientRect();
      return r.top >= -tol && r.left >= -tol &&
        r.bottom <= window.innerHeight + tol && r.right <= window.innerWidth + tol;
    }
    function noDocScroll(tag) {
      var d = document.documentElement;
      check("UI-1: no document overflow in Present " + tag,
        d.scrollWidth <= d.clientWidth + 1 && d.scrollHeight <= d.clientHeight + 1);
    }

    // The built-in example with the most annotations — the intended stress
    // fixture for the presentation and assignment blocks alike. (Its longest
    // sentence is 406 characters, which is why UI-4's measuring moment stopped
    // being forgiving; see runSettled above.)
    function densestExample() {
      var densest = null, max = -1;
      wjt.EXAMPLES.forEach(function (ex) {
        var l = ex.build(), n = 0;
        l.sentences.forEach(function (s) { n += (s.annotations || []).length; });
        if (n > max) { max = n; densest = l; }
      });
      return densest;
    }

    /* -------------------------------------------------------------------- *
     * Presentation checks (9–10) — the slide-shell contract (UI audit 0.1.0)
     * against the real Present and Quiz views. These need a sized window; CI and
     * the documented local recipe pass --window-size=1280,720 (the primary 720p
     * projector gate). The other matrix sizes are the manual browser pass.
     *
     * One function per settled step, in the order runSettled() lists them. Each
     * asserts against the layout the previous step left behind and makes its own
     * change at the very end, so nothing here measures a render from the same
     * task. State the steps share lives in the p* vars below.
     * -------------------------------------------------------------------- */
    var pLessonId = null, pView = null, pStage = null;
    var pPanel = null, pPanelTitle = null, pPanelClose = null, pKeyBtn = null;
    var pPinned = false;

    // Resting panel state: visible-with-hint where pinned, hidden where it's an
    // overlay. Shared by the resting and post-Escape assertions.
    function atRest(tag) {
      check("UI-3: panel is at rest " + tag + " (pinned=" + pPinned + ")",
        pPinned ? (!pPanel.hidden && pPanelTitle.textContent === "Label details")
                : pPanel.hidden);
    }
    // The slide's own info — counter, type badges, reveal tip — has exactly one
    // home: the pinned drawer, so the stage is nothing but the sentence; or the
    // stage itself below that breakpoint, where the panel is hidden while idle
    // and would swallow it. Never both, never neither.
    function slideInfoHome(tag) {
      var inPanel = !!pPanel.querySelector(".slide-counter") && !!pPanel.querySelector(".slide-info");
      var inStage = !!pStage.querySelector(".slide-counter") && !!pStage.querySelector(".slide-info");
      check("UI-1: slide info is in the " + (pPinned ? "drawer" : "stage") + " " + tag,
        pPinned ? (inPanel && !inStage) : (inStage && !inPanel));
    }

    // 9. Present — render only. Every assertion about this render is in
    //    presentClean(), one task later, once the renderer's wrap has run.
    //    (route() scrolls to top before rendering; we call the view directly, so
    //    mirror that or leftover scroll from the earlier checks offsets every
    //    viewport-relative measurement.)
    function presentRender() {
      var densest = densestExample();
      wjt.store.save(densest);
      pLessonId = densest.id;
      window.scrollTo(0, 0);
      wjt.views.present(app, pLessonId);
      pView = app.querySelector(".view-present");
      check("UI-1: Present view rendered", !!pView);
    }

    // 9a. Present — clean state, on the settled layout.
    function presentClean() {
      if (!pView) return;
      noDocScroll("(clean)");

      pStage = pView.querySelector('[data-role="stage"]');
      check("UI-2: clean sentence reserves no .gl-hidden annotation lanes",
        pStage.querySelectorAll(".gl-hidden").length === 0);
      check("UI-1: stage is within the viewport", inViewport(pStage));
      check("UI-1: sentence nav is within the viewport", inViewport(pView.querySelector(".present-nav")));
      // The rail's own bounds passing is not enough: when the RAIL was the
      // scroller, a lesson with enough dots to outgrow it pushed ↓ Next off the
      // bottom, clipped inside a rail that still measured as in-viewport. Only
      // the dot strip scrolls now, so both controls must be fully on screen.
      ["prev", "next"].forEach(function (act) {
        var b = pView.querySelector('[data-act="' + act + '"]');
        var nav = pView.querySelector(".present-nav").getBoundingClientRect();
        var r = b.getBoundingClientRect();
        check("UI-1: the " + act + " control is not clipped by its rail",
          inViewport(b) && r.top >= nav.top - 1 && r.bottom <= nav.bottom + 1);
      });
      check("UI-1: reveal controls are within the viewport", inViewport(pView.querySelector(".present-controls")));

      var dots = pView.querySelectorAll(".dot");
      var labelled = dots.length > 0;
      Array.prototype.forEach.call(dots, function (d) { if (!d.getAttribute("aria-label")) labelled = false; });
      check("UI-9: every sentence dot has an accessible label", labelled);
      check("UI-9: exactly one dot is aria-current",
        pView.querySelectorAll('.dot[aria-current="true"]').length === 1);

      // Turn every layer on. Crossing the clean->breakdown boundary rebuilds the
      // sentence, so this is a fresh render: measured in the next step.
      pView.querySelector('[data-act="all"]').click();
    }

    // 9b. Present — breakdown (all layers on) stays bounded and renders marks.
    function presentBreakdown() {
      if (!pView) return;
      pStage = pView.querySelector('[data-role="stage"]');
      check("UI-2: breakdown renders annotation marks",
        pStage.querySelectorAll(".gl-bar, .gl-chip").length > 0);
      noDocScroll("(breakdown, all layers)");

      // A span bar's label can be wider than the tokens it covers, which used to
      // push the line past the container and scroll it sideways (silently — the
      // .gl-grid scrollbar is hidden). The renderer now wraps on measured width,
      // so a long sentence spills onto another line instead of running off.
      // Multi-token lines must not overflow; a lone token can't wrap, so it's
      // exempt (its bar label ellipsizes instead).
      var runOff = 0, widest = 0, lines = 0;
      Array.prototype.forEach.call(pStage.querySelectorAll(".gl-grid"), function (g) {
        var over = g.scrollWidth - g.clientWidth;
        lines++;
        if (over > widest) widest = over;
        if (over > 1 && g.querySelectorAll(".gl-token").length > 1) runOff++;
      });
      check("UI-4: no wrapped line runs off sideways (" + lines +
        " lines, worst overflow " + widest + "px)", runOff === 0);
      // The stage card, not the page, is the scroller: it stays bounded by the
      // viewport however tall the breakdown gets (noDocScroll above proves the
      // page didn't grow instead). UI-4 stays the guard that an inner scroller
      // can't go back to hiding a sideways run-off.
      check("UI-1: the stage stays bounded by the viewport and owns any overflow",
        inViewport(pStage));
      // ...and "owns" has to mean it actually scrolls. inViewport() alone has no
      // teeth: the shell is overflow:hidden, so a stage that ISN'T a scroll
      // container is clipped by its parent and still passes. It shipped that way
      // once — the base .stage rule sits after the >=641px shell block and its
      // `overflow:visible` silently won. Assert the computed value, and then
      // actually try to scroll it when there is something to scroll.
      var shell = window.matchMedia("(min-width: 641px)").matches;
      check("UI-1: the stage is a scroll container in the slide shell (shell=" + shell + ")",
        (getComputedStyle(pStage).overflowY === "auto") === shell);
      // Force the overflow case rather than hoping the sample breakdown is taller
      // than this particular window: cap the card and it must become scrollable.
      // This is the check with teeth — with overflow:visible back on .stage the
      // content is clipped by the shell instead and scrollTop stays 0.
      // Capped and restored inside this one task, so no reflow sees the cap.
      var capped = pStage.style.maxHeight;
      pStage.style.maxHeight = "90px";
      var canScroll = pStage.scrollHeight > pStage.clientHeight + 1;
      pStage.scrollTop = 9999;
      var moved = pStage.scrollTop;
      pStage.style.maxHeight = capped;
      pStage.scrollTop = 0;
      check("UI-1: a capped stage scrolls instead of clipping (scrollTop " + moved + ")",
        !shell || (canScroll && moved > 0));
      // A scroll container that only a mouse can reach fails WCAG 2.1.1, so the
      // stage is focusable and Up/Down fall through to it while it holds focus.
      check("UI-1: the stage is keyboard-reachable", pStage.tabIndex === 0);
      // In the shell the rail buttons are stretched to the track width; .btn is an
      // inline-flex box with no justify-content of its own, so without this the
      // arrow glyph sits against the left edge.
      check("UI-1: rail arrows are centred in their track",
        !shell || getComputedStyle(pView.querySelector('[data-act="prev"]')).justifyContent === "center");
    }

    // 9c. The shared detail panel, at rest. At >=1025px it is a drawer pinned
    //     open on an idle hint; below that, an on-demand bottom sheet. Either way
    //     the Key button fills it inside the viewport and takes focus, and Escape
    //     dismisses it to its resting state with focus back on the trigger.
    function presentPanelRest() {
      if (!pView) return;
      pPinned = window.matchMedia("(min-width: 1025px)").matches;
      pKeyBtn = pView.querySelector('[data-act="key"]');
      pPanel = pView.querySelector('[data-role="panel"]');
      pPanelTitle = pView.querySelector('[data-role="panel-title"]');
      pPanelClose = pView.querySelector('[data-act="panel-close"]');
      atRest("before any interaction");
      check("UI-3: the panel takes no focus on first render",
        document.activeElement !== pPanelTitle);
      slideInfoHome("at rest");
      // Computed display, not just the property: .btn sets its own display, which
      // beats the UA's [hidden]{display:none} — the ✕ stayed painted until
      // .btn[hidden] was added, and the property alone can't see that.
      check("UI-3: the pinned drawer hides its redundant ✕",
        (getComputedStyle(pPanelClose).display === "none") === pPinned);

      // Fill the panel; its bounds are measured in the next step, because opening
      // it changes the shell's layout (and, unpinned, adds a bottom sheet).
      pKeyBtn.click();
    }

    // 9c (continued). The open panel, on the settled layout.
    function presentPanelOpen() {
      if (!pView) return;
      check("UI-3: Key panel is visible when open", !pPanel.hidden);
      check("UI-3: open Key panel is within the viewport", inViewport(pPanel));
      noDocScroll("(Key open)");
      // The counter is a strip above the heading, not part of the swappable body:
      // it is the teacher's place in the passage, so open content must not take it
      // away. (The badges/tip DO get swapped out — that's the point of the drawer.)
      check("UI-3: the counter survives open panel content",
        pPinned ? !!pPanel.querySelector(".slide-counter") : !!pStage.querySelector(".slide-counter"));
      if (document.activeElement === pPanelTitle) {
        check("UI-3: opening the Key panel moves focus to its heading", true);
        key(document, { key: "Escape" });
        atRest("after Escape");
        slideInfoHome("after Escape");
        check("UI-3: closing restores focus to the Key button", document.activeElement === pKeyBtn);
      } else {
        check("UI-3: panel focus NOT EXERCISED (headless focus unavailable)", true);
        pKeyBtn.click();
        atRest("after a second Key click");
        slideInfoHome("after a second Key click");
      }
    }

    // 9d. Route-away removes the shell state and restores document scrolling.
    function presentLeave() {
      if (!pView) return;
      wjt.views.library(app);
      check("UI-1: leaving Present removes the .view-present shell",
        !app.querySelector(".view-present"));
      check("UI-1: document scroll restored outside Present",
        getComputedStyle(document.body).overflow !== "hidden");
    }

    // 10. Practice — a new question render establishes a focus target.
    function practiceChecks() {
      if (!pLessonId) return;
      wjt.views.quiz(app, pLessonId);
      var startBtn = app.querySelector('[data-act="start"]');
      check("UI-7: Practice setup rendered a Start button", !!startBtn);
      if (startBtn) {
        startBtn.click();  // startQuiz -> renderQuestion, which focuses the prompt
        var prompt = app.querySelector('[data-role="prompt"]');
        check("UI-7: a question prompt heading rendered", !!prompt);
        if (prompt && document.activeElement) {
          if (document.activeElement === prompt) {
            check("UI-7: question render focuses the prompt heading", true);
          } else {
            check("UI-7: question focus NOT EXERCISED (headless focus unavailable)",
              prompt.getAttribute("tabindex") === "-1");
          }
        }
      }
    }

    /* -------------------------------------------------------------------- *
     * Assignment checks (11) — the real builder view behind the real route.
     * Routing goes through location.hash + wjt.rerender() so the app.js route
     * branch is exercised, not just the view function.
     * -------------------------------------------------------------------- */
    function assignmentChecks() {
      var densest = densestExample();
      wjt.store.save(densest);

      // 11a. The route reaches the builder, on the lesson that was asked for.
      location.hash = "#/assign/" + densest.id;
      wjt.rerender();
      var view = app.querySelector(".view-assignment");
      check("A-1: #/assign/<id> renders the assignment builder", !!view);
      if (!view) return;
      check("A-1: the builder opened the lesson from the route",
        (view.querySelector("h2").textContent || "").indexOf(densest.title) !== -1);

      // 11b. The pool readout is the model's number, not a view-side estimate,
      //      and the default draw is DEFAULT_COUNT questions numbered 1..N.
      var pool = wjt.assignment.poolSize(densest, null, null);
      var status = view.querySelector('[data-role="status"]').textContent || "";
      check("A-2: the builder reports the model's real pool (" + pool + ")",
        status.indexOf("pool of " + pool) !== -1);
      var qs = view.querySelectorAll(".assign-question");
      check("A-2: the preview draws the default question count (" +
        qs.length + "/" + wjt.assignment.DEFAULT_COUNT + ")",
        qs.length === Math.min(pool, wjt.assignment.DEFAULT_COUNT));
      var numbered = qs.length > 0;
      Array.prototype.forEach.call(qs, function (q, i) {
        if (q.querySelector(".assign-q-num").textContent !== (i + 1) + ".") numbered = false;
      });
      check("A-2: preview questions are numbered 1..N in order", numbered);

      // 11c. No answer-key material in the student preview. This tests the KEY's
      //      own strings — `source` ("Noun (Parts of Speech)") and teacher notes —
      //      rather than bare label names, because a `find` prompt legitimately
      //      names the label it asks for, and answer text legitimately appears in
      //      the passage. Built with count:"all" so it covers every question the
      //      view could have drawn under any seed.
      var sheet = view.querySelector(".assign-sheet");
      var text = sheet ? sheet.textContent : "";
      var leaked = "";
      wjt.assignment.build(densest, { count: "all" }).key.answers.forEach(function (a) {
        if (!leaked && text.indexOf(a.source) !== -1) leaked = a.source;
        if (!leaked && a.note && text.indexOf(a.note) !== -1) leaked = a.note;
      });
      check("A-3: the student preview carries no answer-key material" +
        (leaked ? " (leaked “" + leaked + "”)" : ""), !leaked);
      check("A-3: the student preview has no answer inputs",
        !!sheet && sheet.querySelectorAll("input, textarea, select, button").length === 0);

      // 11d. Regenerate redraws without disturbing the numbering contract.
      view.querySelector('[data-act="regen"]').click();
      var after = view.querySelectorAll(".assign-question");
      var stillNumbered = after.length === qs.length;
      Array.prototype.forEach.call(after, function (q, i) {
        if (q.querySelector(".assign-q-num").textContent !== (i + 1) + ".") stillNumbered = false;
      });
      check("A-4: Regenerate redraws the same count, still numbered 1..N", stillNumbered);

      // 13. Delivery channels, before anything is printed — the builder's
      //     resting state under a real file:// origin.
      try { deliveryChecks(view, densest); }
      catch (e) { check("delivery checks threw: " + e.message, false); }

      // 12. Print, on this same (densest) lesson and this same builder state.
      try { printChecks(view, densest); }
      catch (e) {
        check("print checks threw: " + e.message, false);
        try { wjt.assignmentPrint.clear(); } catch (e2) { /* teardown is best-effort */ }
      }

      // 11e. A lesson that can only support one skill disables the rest — with
      //      the model's own reason text, not an invented one.
      var thin = wjt.store.create("Assignment check — POS only");
      thin.sentences = [{
        id: wjt.uid(), text: "The curious fox darted across the frozen river.",
        annotations: [{ id: wjt.uid(), start: 4, end: 11, label: "adjective", note: "" }],
        types: {},
      }];
      wjt.store.save(thin);
      location.hash = "#/assign/" + thin.id;
      wjt.rerender();
      var thinView = app.querySelector(".view-assignment");
      check("A-5: the builder opened the single-skill lesson", !!thinView);
      if (!thinView) return;
      check("A-5: skills with nothing to ask about are disabled",
        thinView.querySelectorAll('[data-role="skills"] .pill:disabled').length > 0);
      var reason = "";
      wjt.assignment.availableSkills(thin, null).forEach(function (s) {
        if (!s.available && !reason) reason = s.reason;
      });
      var shown = thinView.querySelector('[data-role="reasons"]').textContent || "";
      check("A-5: the disabled skill shows the model's own reason (“" + reason + "”)",
        !!reason && shown.indexOf(reason) !== -1);
    }

    /* -------------------------------------------------------------------- *
     * Delivery-channel checks (13) — seam S5, in the real builder.
     *
     * This page is loaded over file:///, which is exactly the degraded mode P3
     * describes. So the load-bearing claim — a teacher who double-clicked
     * index.html keeps print and file, and is TOLD why a link isn't on offer —
     * is measured in the environment it is about, not simulated.
     * -------------------------------------------------------------------- */
    function deliveryChecks(view, lesson) {
      var order = wjt.assignmentChannels.ORDER;
      var rows = view.querySelectorAll(".assign-channel");
      check("D-1: this page really is a file:// origin", location.protocol === "file:");
      check("D-1: the builder renders one row per channel, in the module's order",
        rows.length === order.length &&
        Array.prototype.every.call(rows, function (r, i) {
          return r.dataset.channel === order[i];
        }));

      function row(id) {
        return view.querySelector('.assign-channel[data-channel="' + id + '"]');
      }
      function textOf(id, cls) {
        var node = row(id).querySelector(cls);
        return (node && node.textContent) || "";
      }

      check("D-2: print and file stay enabled under file:// — the P3 promise, on screen",
        ["print", "file"].every(function (id) {
          return row(id).dataset.state === "ready" &&
            row(id).querySelectorAll("button:not(:disabled)").length ===
              wjt.assignmentChannels.get(id).actions.length;
        }));
      check("D-3: link is disabled under file://, with the channel's own reason visible",
        row("link").dataset.state === "unavailable" &&
        textOf("link", ".assign-channel-why")
          .indexOf(wjt.assignmentChannels.NO_LINK_REASON) !== -1 &&
        row("link").querySelectorAll("button").length === 0);
      check("D-3: the unavailable channel shows no size readout at all",
        textOf("link", ".assign-channel-size") === "");

      // The readouts are the channel's report, not a view-side estimate — the
      // same rule A-2 holds the pool readout to. The builder's seed is random,
      // so this compares against what is actually on the sheet.
      var drawn = view.querySelectorAll(".assign-sheet .assign-question").length;
      check("D-4: the print readout counts the questions really drawn (" + drawn + ")",
        textOf("print", ".assign-channel-size").indexOf(drawn + " question") === 0 &&
        /no size limit\.$/.test(textOf("print", ".assign-channel-size")));
      check("D-4: the file readout reports a real serialized size",
        /^One \.json file, about [\d,]+ (bytes|KB) — no size limit\.$/
          .test(textOf("file", ".assign-channel-size")));

      // 13b. The File button, with the download intercepted: one .json named
      //      after the title, carrying the student half and nothing else. This is
      //      the same leak assertion as A-3/P-2, on the third delivery surface.
      var realDownload = wjt.downloadJson, got = null;
      wjt.downloadJson = function (obj, filename) { got = { obj: obj, filename: filename }; };
      try { row("file").querySelector('button[data-variant="download"]').click(); }
      finally { wjt.downloadJson = realDownload; }
      check("D-5: the File button downloads one .json named after the title" +
        (got ? " (" + got.filename + ")" : ""),
        !!got && /^[a-z0-9-]+\.assignment\.json$/.test(got.filename));
      var fileText = got ? JSON.stringify(got.obj) : "";
      var leaked = "";
      wjt.assignment.build(lesson, { count: "all" }).key.answers.forEach(function (a) {
        if (!leaked && fileText.indexOf(a.source) !== -1) leaked = a.source;
        if (!leaked && a.note && fileText.indexOf(a.note) !== -1) leaked = a.note;
      });
      check("D-5: the downloaded file carries no answer-key material" +
        (leaked ? " (leaked “" + leaked + "”)" : ""), !!got && !leaked);
      check("D-5: the downloaded file is the assignment format, and drops the seed",
        !!got && got.obj.format === wjt.assignment.FORMAT &&
        got.obj.version === wjt.assignment.VERSION && !("seed" in got.obj) &&
        fileText.indexOf(lesson.id) === -1);

      // 13c. Same shipped code, a web origin: the protocol is the whole gate.
      check("D-6: the link channel turns on for a web origin, with nothing else changed",
        wjt.assignmentChannels.get("link").available({ protocol: "https:" }).available === true &&
        wjt.assignmentChannels.get("link").available({ protocol: "file:" }).available === false);
    }

    /* -------------------------------------------------------------------- *
     * Print checks (12) — the two print surfaces, driven through the real
     * builder buttons, which since S5 are the `print` channel's two actions: a
     * click here goes through wjt.assignmentChannels, so this block covers the
     * delivery path as well as the two printed sheets. window.print is stubbed
     * (a headless print dialog would hang), so `afterprint` is dispatched by
     * hand to cover the teardown.
     *
     * The leak assertion here is the whole point of the phase: a print path
     * that carries the answer key into the student worksheet is the most
     * plausible way to break the no-answers promise by accident, so it is a
     * tested invariant rather than prose.
     * -------------------------------------------------------------------- */

    // The numbered prompts of a rendering, in document order. Preview,
    // worksheet, and answer key must produce identical lists.
    function questionSignature(host) {
      var out = [];
      Array.prototype.forEach.call(host.querySelectorAll(".assign-question"), function (q) {
        out.push((q.querySelector(".assign-q-num").textContent || "") + " " +
          (q.querySelector(".assign-q-prompt").textContent || ""));
      });
      return out.join(" | ");
    }

    function printChecks(view, lesson) {
      var realPrint = window.print, printed = 0;
      window.print = function () { printed++; };
      try {
        var preview = questionSignature(view.querySelector(".assign-sheet"));

        // 12a. The worksheet mounts a purpose-built document, not the app.
        view.querySelector('[data-channel="print"][data-variant="worksheet"]').click();
        var root = document.getElementById("print-root");
        check("P-1: Print worksheet mounts #print-root and calls window.print()",
          !!root && printed === 1);
        if (!root) return;
        check("P-1: the page is flagged as printing the worksheet",
          document.documentElement.getAttribute("data-print") === "worksheet");
        var sheet = root.querySelector(".print-worksheet");
        check("P-1: the worksheet has a title, Name/Class/Date fields, and a footer",
          !!sheet && !!sheet.querySelector(".print-title") &&
          sheet.querySelectorAll(".print-fields .print-rule").length === 3 &&
          (sheet.querySelector(".print-foot").textContent || "")
            .indexOf("Created with Sentence Forge") !== -1);
        check("P-1: the worksheet carries no app chrome, controls, or inputs",
          !!sheet && sheet.querySelectorAll(
            "input, textarea, select, button, nav, .btn, .pill, [data-act]").length === 0);

        // 12b. No answer-bearing material in the student print DOM. Same basis
        //      as A-3: the KEY's own strings, not bare label names, because a
        //      `find` prompt legitimately names the label it asks for.
        var wsText = sheet ? sheet.textContent : "";
        var leaked = "";
        wjt.assignment.build(lesson, { count: "all" }).key.answers.forEach(function (a) {
          if (!leaked && wsText.indexOf(a.source) !== -1) leaked = a.source;
          if (!leaked && a.note && wsText.indexOf(a.note) !== -1) leaked = a.note;
        });
        check("P-2: the printed worksheet carries no answer-key material" +
          (leaked ? " (leaked “" + leaked + "”)" : ""), !leaked);
        check("P-2: the printed worksheet has no answer-key markings",
          wsText.indexOf(wjt.assignmentPrint.KEY_BANNER) === -1 &&
          !sheet.querySelector(".print-answer, .print-accepted, .print-source"));
        check("P-2: the printed worksheet does not carry the lesson id",
          wsText.indexOf(lesson.id) === -1 && !sheet.querySelector("[href]"));
        var worksheetSig = questionSignature(sheet);
        check("P-3: worksheet numbering matches the builder preview",
          !!worksheetSig && worksheetSig === preview);

        // 12c. afterprint puts the page back, without touching builder state.
        var titleWhilePrinting = document.title;
        window.dispatchEvent(new Event("afterprint"));
        check("P-4: afterprint removes #print-root and clears the print flag",
          !document.getElementById("print-root") &&
          !document.documentElement.hasAttribute("data-print"));
        check("P-4: document.title is used for the print, then restored",
          titleWhilePrinting !== document.title);
        check("P-4: the builder survives the print with its questions unchanged",
          questionSignature(view.querySelector(".assign-sheet")) === preview);

        // 12d. The answer key: same numbering, marked, and actually answered.
        view.querySelector('[data-channel="print"][data-variant="key"]').click();
        var keyRoot = document.getElementById("print-root");
        var keyDoc = keyRoot && keyRoot.querySelector(".print-key");
        check("P-5: Print answer key mounts a key document", !!keyDoc && printed === 2);
        if (!keyDoc) return;
        check("P-5: the key is marked “" + wjt.assignmentPrint.KEY_BANNER + "”",
          (keyDoc.querySelector(".print-banner").textContent || "")
            .indexOf(wjt.assignmentPrint.KEY_BANNER) !== -1 &&
          document.title.indexOf("Answer Key") !== -1);
        check("P-5: the key has no student writing space or Name/Date fields",
          keyDoc.querySelectorAll(".assign-line, .print-fields").length === 0);

        var keyQs = keyDoc.querySelectorAll(".assign-question");
        var answered = keyQs.length > 0;
        Array.prototype.forEach.call(keyQs, function (q) {
          var block = q.querySelector(".print-answer");
          if (!block || !block.querySelector(".print-source") ||
              !block.querySelectorAll(".print-accepted-item").length) answered = false;
          Array.prototype.forEach.call(block ? block.querySelectorAll(".print-accepted-item") : [],
            function (li) { if (!(li.textContent || "").trim()) answered = false; });
        });
        check("P-6: every key question carries accepted answers and its source (" +
          keyQs.length + " questions)", answered);
        check("P-6: answer-key numbering matches the worksheet and the preview",
          questionSignature(keyDoc) === worksheetSig);

        // 12e. Ctrl+P from the builder prints the worksheet, not the app — and
        //      never replaces a document that is already on its way to print.
        check("P-7: beforeprint leaves an already-mounted key document alone",
          (window.dispatchEvent(new Event("beforeprint")), true) &&
          !!document.querySelector("#print-root .print-key"));
        wjt.assignmentPrint.clear();
        window.dispatchEvent(new Event("beforeprint"));
        check("P-7: Ctrl+P on the builder mounts the worksheet instead of the app",
          !!document.querySelector("#print-root .print-worksheet") &&
          document.documentElement.getAttribute("data-print") === "worksheet");
      } finally {
        window.print = realPrint;
        wjt.assignmentPrint.clear();
      }
    }
  })();
  </script>
</body>
</html>
