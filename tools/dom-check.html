      var steps = wjt.study.steps("pos", "nouns");
      check("S-6: the first step is the teach screen, with its label cards",
        !!view.querySelector(".study-body") &&
        view.querySelectorAll(".study-label").length ===
          (steps[0].labels || []).length);
      check("S-6: entering a stop records a resume point without completing it",
        wjt.study.progress.read("pos").at === "nouns" &&
        !wjt.study.progress.read("pos").done.nouns);

      // Walk to the first scored step.
      var guard = 0;
      while (view.querySelector('.study-body') && guard++ < 5) {
        var got = view.querySelector('[data-act="next"]');
        if (!got) break;
        got.click();
        view = app.querySelector(".view-study");
      }

      var opts = view.querySelectorAll(".quiz-option");
      check("S-7: a choice question renders its options", opts.length >= 2);
      if (opts.length) {
        // Answer it WRONG on purpose: the wrong path is the one that has to
        // reveal the right answer and name it for a screen reader.
        var stepIdx = 0;
        steps.forEach(function (s, i) { if (s.kind === "choice" && !stepIdx) stepIdx = i; });
        var step = steps[stepIdx];
        var wrongAt = -1;
        step.options.forEach(function (o, i) { if (!o.correct && wrongAt < 0) wrongAt = i; });
        opts[wrongAt].click();
        view = app.querySelector(".view-study");
        var fb = view.querySelector(".quiz-feedback");
        check("S-7: a wrong answer is reported wrong", !!fb && fb.classList.contains("is-wrong"));
        check("S-7: the correct option is revealed",
          view.querySelectorAll(".quiz-option.is-right").length === 1);
        check("S-7: right/wrong reaches a screen reader, not just the colour",
          /incorrect/.test(view.querySelector(".quiz-option.is-wrong").getAttribute("aria-label") || "") &&
          /correct answer/.test(view.querySelector(".quiz-option.is-right").getAttribute("aria-label") || ""));
        check("S-7: every option is disabled once answered",
          Array.prototype.every.call(view.querySelectorAll(".quiz-option"),
            function (o) { return o.disabled; }));
      }

      // Walk to the first `tap` question and answer it from the keyboard path.
      var hops = 0;
      while (hops++ < 60) {
        view = app.querySelector(".view-study");
        if (view.querySelector('[data-act="check"]')) break;
        if (!studyAdvance()) break;
      }
      view = app.querySelector(".view-study");

      var tapStage = app.querySelector('.view-study [data-act="check"]');
      check("S-8: a tap question is reachable by walking the stop", !!tapStage);
      if (tapStage) {
        view = app.querySelector(".view-study");
        var tokens = view.querySelectorAll(".gl-token");
        check("S-8: the tap sentence renders interactive tokens", tokens.length > 0);
        check("S-8: the passage shows NO labels — naming the word is the question",
          view.querySelectorAll(".view-study .gl-chip").length === 0);

        // Check with nothing selected must not score the question.
        var before = view.querySelector(".quiz-feedback").hidden;
        view.querySelector('[data-act="check"]').click();
        view = app.querySelector(".view-study");
        check("S-8: Check with no selection does not score the question",
          before === true && view.querySelector(".quiz-feedback").hidden === true);

        /* Answer it correctly THROUGH THE KEYBOARD PATH — Tab to a word, press
         * Enter. That is the route a keyboard or AT user takes, and the audit
         * (P0-1/P0-3) is the reason it exists, so it is the one worth asserting.
         * Selection is driven by `pointerdown`, not mousedown; a click path
         * would have to say so. */
        var stage = view.querySelector('[data-role="stage"]');
        var toks = stage.querySelectorAll(".gl-token");
        var wantFirst = 0;
        view.__step = null;
        // The step the view is showing is the first tap step of this stop.
        wjt.study.steps("pos", "nouns").forEach(function (s) {
          if (s.kind === "tap" && view.__step === null) { view.__step = s; wantFirst = s.accept[0].first; }
        });
        var target = toks[wantFirst];
        check("S-9: the target word is a focusable token",
          !!target && target.getAttribute("role") === "button");
        if (target) {
          target.focus();
          key(target, { key: "Enter" });
          check("S-9: Enter on a focused word selects exactly that word",
            view.querySelectorAll('[data-role="stage"] .gl-token.is-sel').length === 1 &&
            view.querySelectorAll('[data-role="stage"] .gl-token.is-sel')[0] === target);
          view.querySelector('[data-act="check"]').click();
          view = app.querySelector(".view-study");
          var tfb = view.querySelector(".quiz-feedback");
          check("S-9: a tap answer is scored and explained", !!tfb && tfb.hidden === false);
          check("S-9: the keyboard answer was scored CORRECT",
            !!tfb && tfb.classList.contains("is-right"));
          check("S-9: the answer is revealed as a highlight on the sentence",
            view.querySelectorAll('[data-role="stage"] .gl-token.is-hl').length > 0);
        }
      }

      // Run the stop out to its results screen and confirm it records.
      var out = 0;
      while (out++ < 300 && studyAdvance()) { /* walk */ }
      check("S-10: the stop terminates rather than looping (" + out + " actions)", out < 300);
      view = app.querySelector(".view-study");
      check("S-10: walking a stop to the end reaches a results screen",
        !!view.querySelector(".quiz-results") && !!view.querySelector(".score-ring"));
      var rec = wjt.study.progress.read("pos");
      check("S-10: finishing a stop marks it done and stores a score",
        rec.done.nouns === 1 && typeof rec.best.nouns === "number");
      check("S-10: the stored record holds no per-answer data", (function () {
        var raw = JSON.parse(wjt.safeStorage.get(wjt.study.progressKey("pos")) || "{}");
        return Object.keys(raw).every(function (k) {
          return ["v", "at", "done", "best", "updatedAt"].indexOf(k) !== -1;
        });
      })());

      // The unit must survive a browser that refuses storage — a locked-down
      // school machine gives a forgetful unit, never a blank page.
      var proto = Object.getPrototypeOf(localStorage);
      var origGet = proto.getItem, origSet = proto.setItem, savedOK = wjt.storageOK;
      try {
        proto.getItem = function () { throw new Error("storage disabled"); };
        proto.setItem = function () { throw new Error("storage disabled"); };
        location.hash = "#/study/pos";
        wjt.rerender();
        check("S-11: the unit map still renders with storage refused",
          !!app.querySelector(".view-study .study-stop"));
        location.hash = "#/study/pos/orientation";
        wjt.rerender();
        check("S-11: a stop still renders with storage refused",
          !!app.querySelector(".view-study .quiz-card"));
      } finally {
        proto.getItem = origGet; proto.setItem = origSet; wjt.storageOK = savedOK;
      }

      wjt.study.progress.reset("pos");
    }

    function printChecks(view, lesson) {
      var realPrint = window.print, printed = 0;
      window.print = function () { printed++; };
      try {
        var preview = questionSignature(view.querySelector(".assign-sheet"));

        // 12a. The worksheet mounts a purpose-built document, not the app.
        view.querySelector('[data-channel="print"][data-variant="worksheet"]').click();
        var root = document.getElementById("print-root");
        check("P-1: Print worksheet mounts #print-root and calls window.print()",
          !!root && printed === 1);
        if (!root) return;
        check("P-1: the page is flagged as printing the worksheet",
          document.documentElement.getAttribute("data-print") === "worksheet");
        var sheet = root.querySelector(".print-worksheet");
        check("P-1: the worksheet has a title, Name/Class/Date fields, and a footer",
          !!sheet && !!sheet.querySelector(".print-title") &&
          sheet.querySelectorAll(".print-fields .print-rule").length === 3 &&
          (sheet.querySelector(".print-foot").textContent || "")
            .indexOf("Created with Sentence Forge") !== -1);
        check("P-1: the worksheet carries no app chrome, controls, or inputs",
          !!sheet && sheet.querySelectorAll(
            "input, textarea, select, button, nav, .btn, .pill, [data-act]").length === 0);

        // 12b. No answer-bearing material in the student print DOM. Same basis
        //      as A-3: the KEY's own strings, not bare label names, because a
        //      `find` prompt legitimately names the label it asks for.
        var wsText = sheet ? sheet.textContent : "";
        var leaked = "";
        wjt.assignment.build(lesson, { count: "all" }).key.answers.forEach(function (a) {
          if (!leaked && wsText.indexOf(a.source) !== -1) leaked = a.source;
          if (!leaked && a.note && wsText.indexOf(a.note) !== -1) leaked = a.note;
        });
        check("P-2: the printed worksheet carries no answer-key material" +
          (leaked ? " (leaked “" + leaked + "”)" : ""), !leaked);
        check("P-2: the printed worksheet has no answer-key markings",
          wsText.indexOf(wjt.assignmentPrint.KEY_BANNER) === -1 &&
          !sheet.querySelector(".print-answer, .print-accepted, .print-source"));
        check("P-2: the printed worksheet does not carry the lesson id",
          wsText.indexOf(lesson.id) === -1 && !sheet.querySelector("[href]"));
        var worksheetSig = questionSignature(sheet);
        check("P-3: worksheet numbering matches the builder preview",
          !!worksheetSig && worksheetSig === preview);

        // 12c. afterprint puts the page back, without touching builder state.
        var titleWhilePrinting = document.title;
        window.dispatchEvent(new Event("afterprint"));
        check("P-4: afterprint removes #print-root and clears the print flag",
          !document.getElementById("print-root") &&
          !document.documentElement.hasAttribute("data-print"));
        check("P-4: document.title is used for the print, then restored",
          titleWhilePrinting !== document.title);
        check("P-4: the builder survives the print with its questions unchanged",
          questionSignature(view.querySelector(".assign-sheet")) === preview);

        // 12d. The answer key: same numbering, marked, and actually answered.
        view.querySelector('[data-channel="print"][data-variant="key"]').click();
        var keyRoot = document.getElementById("print-root");
        var keyDoc = keyRoot && keyRoot.querySelector(".print-key");
        check("P-5: Print answer key mounts a key document", !!keyDoc && printed === 2);
        if (!keyDoc) return;
        check("P-5: the key is marked “" + wjt.assignmentPrint.KEY_BANNER + "”",
          (keyDoc.querySelector(".print-banner").textContent || "")
            .indexOf(wjt.assignmentPrint.KEY_BANNER) !== -1 &&
          document.title.indexOf("Answer Key") !== -1);
        check("P-5: the key has no student writing space or Name/Date fields",
          keyDoc.querySelectorAll(".assign-line, .print-fields").length === 0);

        var keyQs = keyDoc.querySelectorAll(".assign-question");
        var answered = keyQs.length > 0;
        Array.prototype.forEach.call(keyQs, function (q) {
          var block = q.querySelector(".print-answer");
          if (!block || !block.querySelector(".print-source") ||
              !block.querySelectorAll(".print-accepted-item").length) answered = false;
          Array.prototype.forEach.call(block ? block.querySelectorAll(".print-accepted-item") : [],
            function (li) { if (!(li.textContent || "").trim()) answered = false; });
        });
        check("P-6: every key question carries accepted answers and its source (" +
          keyQs.length + " questions)", answered);
        check("P-6: answer-key numbering matches the worksheet and the preview",
          questionSignature(keyDoc) === worksheetSig);

        // 12e. Ctrl+P from the builder prints the worksheet, not the app — and
        //      never replaces a document that is already on its way to print.
        check("P-7: beforeprint leaves an already-mounted key document alone",
          (window.dispatchEvent(new Event("beforeprint")), true) &&
          !!document.querySelector("#print-root .print-key"));
        wjt.assignmentPrint.clear();
        window.dispatchEvent(new Event("beforeprint"));
        check("P-7: Ctrl+P on the builder mounts the worksheet instead of the app",
          !!document.querySelector("#print-root .print-worksheet") &&
          document.documentElement.getAttribute("data-print") === "worksheet");
      } finally {
        window.print = realPrint;
        wjt.assignmentPrint.clear();
      }
    }
  })();
  </script>
</body>
</html>
